<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2f34"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#e0785a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e0785a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eb8a63"/>
      <stop offset="1" stop-color="#d76a4c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="225" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- prompt chevron ">" -->
